name: Diagnostic API CROUS

on: workflow_dispatch

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test des outils de recherche 47 et 44
        run: |
          for tool in 47 44; do
            echo "=== TOOL $tool ==="
            resp=$(curl -s -X POST "https://trouverunlogement.lescrous.fr/api/fr/search/$tool" \
              -H "Content-Type: application/json" -H "Accept: application/json" -H "User-Agent: Mozilla/5.0" \
              -d "{\"idTool\":$tool,\"need_aggregation\":false,\"page\":1,\"pageSize\":100,\"sector\":null,\"occupationModes\":[],\"residence\":null,\"precision\":null,\"equipment\":[],\"price\":{\"min\":0,\"max\":10000000},\"location\":null}" \
              --max-time 30)
            echo "$resp" | python3 -c "
import json, sys, re
try:
    d = json.load(sys.stdin)
    res = d['results']
    items = res['items']
    paris = [it for it in items if re.search(r'(?<!\d)75\d{3}(?!\d)', (it.get('residence') or {}).get('address','') or '')]
    print('TOTAL:', res['total'], '| ITEMS:', len(items), '| PARIS:', len(paris))
    if items:
        it = items[0]
        keys = sorted(it.keys())
        print('CHAMPS:', ','.join(keys[:12]))
        r = it.get('residence') or {}
        print('EXEMPLE:', it.get('id'), '|', r.get('label'), '|', (it.get('occupationModes') or [{}])[0].get('rent'))
except Exception as e:
    print('ERREUR PARSING:', e, '| brut:', sys.stdin.read()[:200] if not sys.stdin.isatty() else '')
"
          done
