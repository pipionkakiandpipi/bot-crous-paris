name: Vérification CROUS Paris

# Surveille les nouveaux logements CROUS toutes les 10 minutes.
# Le 1er de chaque mois, un commit "keepalive" évite que GitHub ne
# désactive le workflow après 60 jours sans activité sur le repo.

on:
  schedule:
    - cron: '*/10 * * * *'   # toutes les 10 minutes
    - cron: '0 3 1 * *'      # le 1er de chaque mois à 3h UTC (garder le cron actif)
  workflow_dispatch:        # permet aussi de lancer manuellement
    inputs:
      test_email:
        description: "Envoyer aussi un email de test (vérifier la configuration Gmail)"
        type: boolean
        required: false
        default: false
      diag:
        description: "Diagnostic API uniquement (outils 47 et 44), sans surveillance"
        type: boolean
        required: false
        default: false

permissions:
  contents: write            # nécessaire pour committer seen.json

concurrency:
  group: crous-check         # évite que deux exécutions ne se chevauchent
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Diagnostic API (temporaire, outils 47 et 44)
        if: inputs.diag
        run: |
          for tool in 47 44; do
            echo "=== TOOL $tool ==="
            curl -s -X POST "https://trouverunlogement.lescrous.fr/api/fr/search/$tool" \
              -H "Content-Type: application/json" -H "Accept: application/json" -H "User-Agent: Mozilla/5.0" \
              -d "{\"idTool\":$tool,\"need_aggregation\":false,\"page\":1,\"pageSize\":100,\"sector\":null,\"occupationModes\":[],\"residence\":null,\"precision\":null,\"equipment\":[],\"price\":{\"min\":0,\"max\":10000000},\"location\":null}" \
              --max-time 30 | python3 -c "
          import json, sys, re
          raw = sys.stdin.read()
          try:
              d = json.loads(raw)
              res = d['results']; items = res['items']
              paris = [it for it in items if re.search(r'(?<!\d)75\d{3}(?!\d)', (it.get('residence') or {}).get('address','') or '')]
              print('TOTAL:', res['total'], '| ITEMS:', len(items), '| PARIS:', len(paris))
              for it in paris[:5]: print('  75:', it.get('id'), '|', (it.get('residence') or {}).get('label'), '|', (it.get('residence') or {}).get('address'))
              it = items[0]
              print('CHAMPS OK:', 'id' in it and 'residence' in it and 'occupationModes' in it and 'available' in it)
              om = (it.get('occupationModes') or [{}])[0]
              print('RENT:', om.get('rent'), '| BOOKING:', it.get('bookingData'))
          except Exception as e:
              print('ERREUR:', e, '| BRUT:', raw[:150])
          "
          done

      - name: Vérification des logements CROUS
        if: ${{ !inputs.diag }}
        id: check
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          CROUS_TOOL_IDS: '47,44'
          PARIS_POSTAL_PREFIXES: '75'
          SEND_TEST_EMAIL: ${{ inputs.test_email && 'true' || 'false' }}
        run: python crous_bot.py

      - name: Sauvegarde de l'état (seen.json + history.jsonl)
        if: ${{ !inputs.diag }}
        env:
          NEW_COUNT: ${{ steps.check.outputs.new_count }}
        run: |
          git config user.name "crous-bot[bot]"
          git config user.email "actions@github.com"
          git add seen.json
          if [ -f history.jsonl ]; then git add history.jsonl; fi
          if git diff --cached --quiet; then
            echo "Aucun changement d'état à sauvegarder."
          else
            git commit -m "Surveillance : état mis à jour${NEW_COUNT:+ ($NEW_COUNT nouveau(x) logement(s))}"
            git push
            echo "seen.json commité."
          fi

  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit mensuel pour garder le cron actif
        run: |
          git config user.name "crous-bot[bot]"
          git config user.email "actions@github.com"
          date -u > .keepalive
          git add .keepalive
          git commit -m "Keepalive mensuel (évite la désactivation du cron à 60 jours)"
          git push
