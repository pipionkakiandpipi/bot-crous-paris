name: Watchdog + résumé hebdo CROUS

# Contrôle de santé du bot : si aucune vérification réussie depuis 35 à
# 95 minutes, un email "BOT EN PANNE" est envoyé (exactement un par panne).
# Chaque dimanche soir, un email de résumé confirme que tout fonctionne.

on:
  schedule:
    - cron: '0 * * * *'      # watchdog toutes les heures
    - cron: '0 18 * * 0'     # résumé hebdo le dimanche 18h UTC (19-20h Paris)
  workflow_dispatch:        # tests manuels
    inputs:
      watchdog:
        description: "Lancer le watchdog maintenant (contrôle de santé)"
        type: boolean
        required: false
        default: false
      digest:
        description: "Envoyer le résumé hebdo maintenant"
        type: boolean
        required: false
        default: false

permissions:
  actions: read      # lire l'historique des runs du workflow de surveillance
  contents: read      # lire seen.json / history.jsonl pour le digest

jobs:
  watchdog:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.watchdog) ||
      (github.event_name == 'schedule' && github.event.schedule == '0 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Contrôle de santé du bot
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GITHUB_API_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python crous_bot.py --watchdog

  digest:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.digest) ||
      (github.event_name == 'schedule' && github.event.schedule == '0 18 * * 0')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Résumé hebdomadaire
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python crous_bot.py --digest
